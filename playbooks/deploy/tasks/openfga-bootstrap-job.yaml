- name: Remove previous bootstrap job
  kubernetes.core.k8s:
    state: absent
    api_version: batch/v1
    kind: Job
    name: openfga-bootstrap
    namespace: "{{ agentos_namespace }}"
    wait: true

- name: Run OpenFGA bootstrap command
  kubernetes.core.k8s:
    state: present
    wait: true
    wait_condition: {type: Complete, status: "True"}
    wait_timeout: 600
    definition:
      apiVersion: batch/v1
      kind: Job
      metadata: {name: openfga-bootstrap, namespace: "{{ agentos_namespace }}"}
      spec:
        backoffLimit: 1
        ttlSecondsAfterFinished: 3600
        template:
          metadata:
            labels: {app.kubernetes.io/name: openfga-bootstrap}
          spec:
            restartPolicy: Never
            automountServiceAccountToken: false
            securityContext:
              runAsNonRoot: true
              runAsUser: 65532
              runAsGroup: 65532
              fsGroup: 65532
              seccompProfile: {type: RuntimeDefault}
            containers:
              - name: fga
                image: "{{ openfga_cli_image }}"
                imagePullPolicy: IfNotPresent
                args: "{{ openfga_bootstrap_argv + ['--api-url=https://openfga.' + agentos_namespace + '.svc:8080', '--api-token=$(API_TOKEN)'] }}"
                env:
                  - name: API_TOKEN
                    valueFrom: {secretKeyRef: {name: openfga-auth, key: keys}}
                  - {name: SSL_CERT_FILE, value: /etc/openfga/ca/tls.crt}
                securityContext:
                  readOnlyRootFilesystem: true
                  allowPrivilegeEscalation: false
                  capabilities: {drop: [ALL]}
                volumeMounts:
                  - {name: ca, mountPath: /etc/openfga/ca, readOnly: true}
                  - {name: input, mountPath: /etc/openfga/input, readOnly: true}
            volumes:
              - name: ca
                secret:
                  secretName: openfga-ca
                  items: [{key: tls.crt, path: tls.crt}]
              - name: input
                configMap: {name: openfga-bootstrap-input}
  no_log: true

- name: Read OpenFGA bootstrap result
  kubernetes.core.k8s_log:
    api_version: batch/v1
    kind: Job
    name: openfga-bootstrap
    namespace: "{{ agentos_namespace }}"
  register: openfga_bootstrap_log
  no_log: true
