- name: Validate native execution authorization
  ansible.builtin.assert:
    that:
      - site_identity.get('clientId', '') | length > 0
      - site_identity.get('audience', '') | length > 0
      - kagent_execution_authorization.get('scopeClaim', '') | length > 0
      - kagent_execution_authorization.get('rules', []) | length > 0
      - kagent_execution_authorization.get('gatewayAudience', '') | length > 0
    fail_msg: Native execution authorization requires OIDC identity and a complete ResourceScopeRule allowlist with gatewayAudience.
    quiet: true

- name: Discover the native identity provider
  ansible.builtin.include_tasks: ../../environments/tasks/discover-oidc.yaml
  vars:
    oidc_issuer: "{{ site_identity.get('issuer', '') }}"

- name: Provision native execution credentials
  no_log: true
  diff: false
  block:
    - name: Discover the native execution encryption key
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: kagent-execution-credentials
        namespace: "{{ agentos_namespace }}"
      register: native_execution_credentials

    - name: Require a valid native execution encryption key
      ansible.builtin.assert:
        that:
          - native_execution_credentials.resources[0].get('data', {}).get('key', '') | b64decode(encoding='latin-1') | length == 32
        quiet: true
      when: native_execution_credentials.resources | length > 0

    - name: Configure native identity credentials
      ansible.builtin.include_tasks: identity-credentials.yaml

    - name: Generate the native execution encryption key
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - -c
          - import base64, secrets; print(base64.b64encode(secrets.token_bytes(32)).decode())
      register: native_execution_key
      changed_when: false
      check_mode: false
      when: native_execution_credentials.resources | length == 0

    - name: Create the native execution encryption key
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata: {name: kagent-execution-credentials, namespace: "{{ agentos_namespace }}"}
          type: Opaque
          data:
            key: "{{ native_execution_key.stdout }}"
      when: native_execution_credentials.resources | length == 0
