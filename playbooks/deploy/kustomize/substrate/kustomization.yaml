apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [resources.yaml]
patches:
  - target: {kind: DaemonSet, name: atelet}
    patch: |-
      apiVersion: apps/v1
      kind: DaemonSet
      metadata: {name: atelet}
      spec:
        template:
          spec:
            volumes:
              - name: image-credentials
                secret: {secretName: atelet-image-credentials, defaultMode: 256}
            containers:
              - name: atelet
                volumeMounts:
                  - {name: image-credentials, mountPath: /run/image-credentials, readOnly: true}
replacements:
  - sourceValue: 2m
    targets:
      - select: {kind: ConfigMap, name: atenet-router-agentgateway-config}
        fieldPaths:
          - data.config\.yaml.routes.[name=^substrate-actors$].policies.substrateIngress.requestParking.budget
        options: {create: true}
