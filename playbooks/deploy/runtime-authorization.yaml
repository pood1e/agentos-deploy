- name: Prepare native Substrate operator identity
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ServiceAccount
      metadata: {name: agentos-substrate-operator, namespace: ate-system}
      automountServiceAccountToken: false

- name: Admit platform services to the native Substrate API
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata: {name: agentos-platform-api, namespace: ate-system}
      spec:
        podSelector:
          matchLabels: {app: ate-api-server}
        policyTypes: [Ingress]
        ingress:
          - from:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: "{{ agentos_namespace }}"
                podSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/component
                      operator: In
                      values: [dataplane, controller]
            ports: [{port: 443, protocol: TCP}]
