- name: Discover database cluster
  kubernetes.core.k8s_info:
    api_version: postgresql.cnpg.io/v1
    kind: Cluster
    name: kagent-postgres
    namespace: "{{ agentos_namespace }}"
  register: database_cluster

- name: Converge PostgreSQL cluster
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      metadata: {name: kagent-postgres, namespace: "{{ agentos_namespace }}"}
      spec:
        instances: 1
        imageName: "{{ postgres_image }}"
        storage: {size: 2Gi, storageClass: local-path}
        resources: "{{ kagent_postgres_resources }}"
        bootstrap: >-
          {{ database_cluster.resources[0].spec.bootstrap if database_cluster.resources | length > 0
             else database_bootstrap | default({'initdb': database_initdb}) }}
        externalClusters: >-
          {{ database_cluster.resources[0].spec.externalClusters | default([])
             if database_cluster.resources | length > 0 else database_external_clusters | default([]) }}
  vars:
    database_initdb:
      database: kagent
      owner: kagent_owner
      secret: {name: kagent-postgres-app}
      postInitApplicationSQL:
        - CREATE SCHEMA extensions
        - CREATE EXTENSION vector WITH SCHEMA extensions
        - REVOKE ALL ON SCHEMA extensions FROM PUBLIC
        - GRANT USAGE ON SCHEMA extensions TO kagent_owner

- name: Wait for PostgreSQL readiness
  kubernetes.core.k8s_info:
    api_version: postgresql.cnpg.io/v1
    kind: Cluster
    name: kagent-postgres
    namespace: "{{ agentos_namespace }}"
    wait: true
    wait_condition: {type: Ready, status: "True"}
    wait_timeout: 900

- name: Provision OpenFGA database role
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: postgresql.cnpg.io/v1
      kind: DatabaseRole
      metadata: {name: openfga-owner, namespace: "{{ agentos_namespace }}"}
      spec:
        cluster: {name: kagent-postgres}
        name: openfga_owner
        login: true
        superuser: false
        passwordSecret: {name: openfga-postgres-app}

- name: Wait for OpenFGA database role
  kubernetes.core.k8s_info:
    api_version: postgresql.cnpg.io/v1
    kind: DatabaseRole
    name: openfga-owner
    namespace: "{{ agentos_namespace }}"
  register: openfga_database_role
  until: openfga_database_role.resources | length > 0 and openfga_database_role.resources[0].status.applied | default(false)
  retries: 30
  delay: 2

- name: Provision OpenFGA database
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: postgresql.cnpg.io/v1
      kind: Database
      metadata: {name: openfga, namespace: "{{ agentos_namespace }}"}
      spec:
        cluster: {name: kagent-postgres}
        name: openfga
        owner: openfga_owner

- name: Wait for OpenFGA database
  kubernetes.core.k8s_info:
    api_version: postgresql.cnpg.io/v1
    kind: Database
    name: openfga
    namespace: "{{ agentos_namespace }}"
  register: openfga_database
  until: openfga_database.resources | length > 0 and openfga_database.resources[0].status.applied | default(false)
  retries: 30
  delay: 2

- name: Restrict database ingress
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata: {name: kagent-database, namespace: "{{ agentos_namespace }}"}
      spec:
        podSelector:
          matchLabels: {cnpg.io/cluster: kagent-postgres}
        policyTypes: [Ingress]
        ingress:
          - from:
              - podSelector:
                  matchLabels: {app.kubernetes.io/name: kagent, app.kubernetes.io/component: controller}
              - podSelector:
                  matchLabels: {app.kubernetes.io/name: agentos}
                  matchExpressions:
                    - {key: app.kubernetes.io/component, operator: In, values: [api, dataplane]}
              - namespaceSelector:
                  matchLabels: {kubernetes.io/metadata.name: ate-system}
                podSelector:
                  matchLabels: {app: ate-api-server}
              - podSelector:
                  matchLabels: {cnpg.io/cluster: kagent-postgres}
              - podSelector:
                  matchLabels: {app.kubernetes.io/name: openfga, app.kubernetes.io/instance: openfga}
            ports: [{port: 5432, protocol: TCP}]
          - from:
              - namespaceSelector:
                  matchLabels: {kubernetes.io/metadata.name: cnpg-system}
            ports: [{port: 8000, protocol: TCP}, {port: 5432, protocol: TCP}]
