scopeClaim: roles
gatewayAudiences:
  - http://agentos-gateway.agentos.svc.cluster.local:8080
  - http://agentos-mcp-gateway.agentos.svc.cluster.local:8080
rules:
  - {resourceType: Session, verbs: [get, list]}
  - {resourceType: Session, verbs: [create, update, delete], anyScope: [agentos-writer]}
  - {resourceType: Agent, verbs: [get, list]}
  - {resourceType: Agent, verbs: [create, update, delete], anyScope: [agentos-agents-manage]}
  - {resourceType: TaskStore, verbs: [get, list, create, update]}
  - {resourceType: ToolInventory, verbs: [update]}
  - {resourceType: Memory, verbs: [get, list, create], anyScope: [agentos-writer]}
  - {resourceType: TeamMemory, verbs: [get, list]}
  - {resourceType: TeamMemory, verbs: [create, delete], anyScope: [agentos-knowledge-manage]}
