name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      ANSIBLE_CONFIG: ansible.cfg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.10.18
      - run: |
          uv venv .cache/venv
          uv pip install --python .cache/venv/bin/python -r requirements.txt -r ci/requirements.txt
          echo "$PWD/.cache/venv/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: collections
        with:
          path: .cache/collections
          key: collections-${{ runner.os }}-${{ hashFiles('ci/collections.yaml') }}
      - run: ansible-galaxy collection install -r ci/collections.yaml -p .cache/collections
        if: steps.collections.outputs.cache-hit != 'true'
      - run: ci/check.sh
